      - 'security/build80/**'
      - 'security/build81/**'
      - 'security/build82/**'
      - 'security/build83/**'
      - 'security/build84/**'
      - 'security/build85/**'
      - 'security/build86/**'
      - 'security/build115/**'
      - 'src/hooks/use-auth.tsx'
      - 'src/lib/auth-identity-epoch.ts'
      - '.github/workflows/security-build65-fast.yml'
  pull_request:
    paths:
      - 'security/build41/signed-http-135-read-matrix.json'
      - 'security/build64/**'
      - 'security/build65/**'
      - 'security/build66/**'
      - 'security/build67/**'
      - 'security/build68/**'
      - 'security/build69/**'
      - 'security/build70/**'
      - 'security/build71/**'
      - 'security/build72/**'
      - 'security/build73/**'
      - 'security/build74/**'
      - 'security/build75/**'
      - 'security/build77/**'
      - 'security/build78/**'
      - 'security/build79/**'
      - 'security/build80/**'
      - 'security/build81/**'
      - 'security/build82/**'
      - 'security/build83/**'
      - 'security/build84/**'
      - 'security/build85/**'
      - 'security/build86/**'
      - 'security/build115/**'
      - 'src/hooks/use-auth.tsx'
      - 'src/lib/auth-identity-epoch.ts'
      - '.github/workflows/security-build65-fast.yml'
permissions:
  contents: read
# Supersede stale review-branch workflows when many approved edits land in bulk.
# This never disables the latest production-release hold.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hosted-uat-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run historic read-matrix, exact-role fixture, scope-gap and CI integrity tests
        run: |
          node --test security/build64/hosted-135-readonly.test.mjs security/build64/aggregate-ci-contract.test.mjs security/build65/coverage-contract.test.mjs security/build66/hosted-anon-extra-scope.test.mjs security/build66/coverage-and-key-contract.test.mjs security/build66/extra-public-surfaces-contract.test.mjs security/build67/data-minimization-contract.test.mjs security/build68/hosted-positive-controls.test.mjs security/build68/view-fixture-dependencies.test.mjs security/build68/exact-content-range.test.mjs security/build69/fixture-source-contract.test.mjs security/build69/hosted-readiness-contract.test.mjs security/build69/recruiter-view-scope.test.mjs security/build69/complete-19-fixture-contract.test.mjs security/build70/source-replay-contract.test.mjs security/build71/anonymous-view-replay-contract.test.mjs security/build72/truncate-and-function-contract.test.mjs security/build72/function-public-fallback-contract.test.mjs security/build72/release-review-bridge.test.mjs security/build73/48-object-preflight-contract.test.mjs security/build73/live-gate-observation.test.mjs security/build74/combined-postflight.test.mjs security/build74/negative-release-replay.test.mjs security/build74/live-release-source-fingerprints.test.mjs security/build75/trigger-and-hosted-fixture-contract.test.mjs security/build75/auth-bootstrap-hardening-contract.test.mjs security/build75/inert-defaults-contract.test.mjs security/build77/source-contract.test.mjs security/build78/source-contract.test.mjs security/build78/provision-nine-auth-users.test.mjs security/build78/seed-inert-base-fixture.test.mjs security/build79/compose-and-seed-remaining-fixture.test.mjs security/build79/live-source-column-fk-check-contract.test.mjs security/build79/minimal-three-policy-review-only.test.mjs security/build79/full-synthetic-postseed-contract.test.mjs security/build80/role-read-oracle.test.mjs security/build80/15-surface-read-policy.test.mjs security/build80/role-coverage-contract.test.mjs security/build80/pg17-135-read-rehearsal-contract.test.mjs security/build81/server-unique-role-gate.test.mjs security/build81/source-shaped-38-fixture.test.mjs security/build81/candidate-provider-error-redaction.test.mjs security/build81/pg17-full-source-135-rls-addon.test.mjs security/build82/external-effects-release-interlocks.test.mjs security/build82/provider-redaction-and-smtp-rotation.test.mjs security/build82/record-bound-email-recipient.test.mjs security/build83/sync-configuration-and-duplicate-privacy.test.mjs security/build84/remote-download-boundary.test.mjs security/build85/core-data-access-privacy.test.mjs security/build86/crm-email-record-scope.test.mjs security/build115/auth-identity-epoch.test.mjs
      - name: Preserve no-secret, offline-only run scope
        run: |
          test -f security/build65/production-hosted-coverage.json
          ! grep -E 'AMF_UAT_CASE_[0-9]+_(EMAIL|PASSWORD):' .github/workflows/security-build65-fast.yml
