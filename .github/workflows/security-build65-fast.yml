permissions:
  contents: read
# Supersede stale review-branch workflows when many approved edits land in bulk.
# This never disables the latest production-release hold.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Build132: tests of .ts source do not invoke TypeScript. This small,
  # independent compilation check catches broken PostgREST/RLS adapter types
  # before guarded CI completes, without ever accessing hosted credentials.
  application-typecheck-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without scripts or network audits
        run: npm ci --ignore-scripts --no-audit --no-fund
      # TanStack file-route types are generated by the Vite plugin during build.
      # Running tsc directly from a clean checkout yields false routeTree errors.
      - name: Generate routes and compile the app before typecheck
        run: npm run build
      - name: Fail fast on TypeScript compilation defects
        run: npx tsc --noEmit

  # The Build131/early Build132 write-hold regressions lived only in
  # slower guarded jobs. Catch both independent source contracts immediately.
  critical-write-hold-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate mutation and financial-join holds
        run: node --test security/build50/source-contract.test.mjs security/build56/source-contract.test.mjs

  hosted-uat-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run historic read-matrix, exact-role fixture, scope-gap and CI integrity tests
        run: |
          node --test security/build64/hosted-135-readonly.test.mjs security/build64/aggregate-ci-contract.test.mjs security/build65/coverage-contract.test.mjs security/build66/hosted-anon-extra-scope.test.mjs security/build66/coverage-and-key-contract.test.mjs security/build66/extra-public-surfaces-contract.test.mjs security/build67/data-minimization-contract.test.mjs security/build68/hosted-positive-controls.test.mjs security/build68/view-fixture-dependencies.test.mjs security/build68/exact-content-range.test.mjs security/build69/fixture-source-contract.test.mjs security/build69/hosted-readiness-contract.test.mjs security/build69/recruiter-view-scope.test.mjs security/build69/complete-19-fixture-contract.test.mjs security/build70/source-replay-contract.test.mjs security/build71/anonymous-view-replay-contract.test.mjs security/build72/truncate-and-function-contract.test.mjs security/build72/function-public-fallback-contract.test.mjs security/build72/release-review-bridge.test.mjs security/build73/48-object-preflight-contract.test.mjs security/build73/live-gate-observation.test.mjs security/build74/combined-postflight.test.mjs security/build74/negative-release-replay.test.mjs security/build74/live-release-source-fingerprints.test.mjs security/build75/trigger-and-hosted-fixture-contract.test.mjs security/build75/auth-bootstrap-hardening-contract.test.mjs security/build75/inert-defaults-contract.test.mjs security/build77/source-contract.test.mjs security/build78/source-contract.test.mjs security/build78/provision-nine-auth-users.test.mjs security/build78/seed-inert-base-fixture.test.mjs security/build79/compose-and-seed-remaining-fixture.test.mjs security/build79/live-source-column-fk-check-contract.test.mjs security/build79/minimal-three-policy-review-only.test.mjs security/build79/full-synthetic-postseed-contract.test.mjs security/build80/role-read-oracle.test.mjs security/build80/15-surface-read-policy.test.mjs security/build80/role-coverage-contract.test.mjs secur