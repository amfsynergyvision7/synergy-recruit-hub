name: Legacy CRM outbound email containment (review only)
on:
  pull_request:
    paths:
      - 'src/lib/email.functions.ts'
      - 'src/lib/email.server.ts'
      - 'src/lib/legacy-outbound-email-release-hold.server.ts'
      - 'tests/legacy-outbound-email-hold.test.mjs'
      - '.github/workflows/legacy-email-hold.yml'
  push:
    branches:
      - 'security/legacy-email-send-hold-review-20261117'
permissions:
  contents: read
jobs:
  no-smtp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/legacy-outbound-email-hold.test.mjs
  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
