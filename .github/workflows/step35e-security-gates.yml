name: Isolated Step 35E security gates
on:
  push:
    branches: [security/step-35e-isolated-hardening]
  workflow_dispatch:
jobs:
  source-security-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/step35e-security-gates.test.mjs
