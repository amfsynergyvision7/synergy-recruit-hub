name: Security Build 2 offline checks
on:
  workflow_dispatch:
  push:
    branches:
      - security/build2-step35e-main-delta-draft-20261110
    paths:
      - 'security/build2/**'
      - 'src/components/CrudModule.tsx'
      - 'src/components/DriveImportButton.tsx'
      - 'src/components/CandidateBoard.tsx'
      - 'src/routes/_app.candidates.tsx'
      - '.github/workflows/security-build2-offline.yml'
      - '.github/workflows/step35e-security-gates.yml'
      - 'tests/step35e-*.test.mjs'
      - 'tests/security-release-gates.test.mjs'
      - 'src/lib/security/**'
      - 'src/lib/ai.*'
      - 'src/lib/email.*'
      - 'src/integrations/supabase/**'
      - 'package.json'
      - 'scripts/vercel-build.mjs'
      - 'src/routes/_app.bd.tsx'
      - 'src/lib/bd-demo-model.ts'
      - 'src/components/AppSidebar.tsx'
      - 'tests/bd-*.test.mjs'
permissions:
  contents: read
concurrency:
  group: build2-disposable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application-typescript-check:
    if: ${{ github.ref == 'refs/heads/security/build2-step35e-main-delta-draft-20261110' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate TanStack route tree and compile application
        run: npm run build
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Verify BD remains synthetic and demo-only
        run: node --test tests/bd-*.test.mjs
  offline-security-tests:
    if: ${{ github.ref == 'refs/heads/security/build2-step35e-main-delta-draft-20261110' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all offline security contract tests
        run: node --test security/build2/*.test.mjs
      - name: Verify all 26 migrations are inventoried and unsafe unattended replay is blocked
        shell: bash
        run: |
          set +e
          node security/build2/migration-replay-preflight.mjs supabase/migrations > /tmp/build2-migration-preflight.json
          code=$?
          set -e
          test "$code" -eq 2
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('/tmp/build2-migration-preflight.json','utf8')); if(r.migration_count!==26||r.safe_to_replay_unattended!==false||!r.blockers.some(x=>x.type==='auth_schema_fixture_required'))process.exit(1);"
          echo 'PASS: all 26 migrations inventoried; unattended replay blocked.'
      - name: Batch-triage all 26 original migrations and preserve 6-file review queue
        run: |
          node security/build2/bulk-migration-triage.mjs supabase/migrations > /tmp/build2-bulk-triage.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('/tmp/build2-bulk-triage.json','utf8')); if(r.total!==26||r.subset_candidates!==20||r.remaining!==6||r.all_26_replay_verified!==false)process.exit(1);"
      - name: Generate dependency-aware seven-batch review queue without SQL execution
        run: |
          node security/build2/migration-review-queue.mjs supabase/migrations > /tmp/build2-review-queue.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const q=JSON.parse(readFileSync('/tmp/build2-review-queue.json','utf8')); if(q.total!==26||q.blocked!==6||q.batch_count!==6||q.unattended_sql_execution_authorized!==false||q.production_release!=='HOLD')process.exit(1);"
      - name: Verify production release is blocked
        shell: bash
        run: |
          set +e
          node security/build2/release-gate.mjs > gate-output.txt 2>&1
          code=$?
          set -e
          cat gate-output.txt
          test "$code" -eq 1
          grep -q 'PRODUCTION RELEASE BLOCKED' gate-output.txt
          test "$(grep -c '^BLOCK |' gate-output.txt)" -eq 9
          echo 'PASS: All nine release conditions remain blocked.'

  isolated-postgres-view-rls:
    if: ${{ github.ref == 'refs/heads/security/build2-step35e-main-delta-draft-20261110' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: build2_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic_test_only
      PGDATABASE: build2_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless connected to exact disposable PostgreSQL service
        run: |
          node security/build2/assert-disposable-db-target.mjs
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'select current_database()')" = "build2_synthetic"
      - name: Verify pinned synthetic replay contract before PostgreSQL execution
        run: node security/build2/migration-replay-contract-guard.mjs security/build2/disposable-replay-contract.json supabase/migrations
      - name: Reject non-allowlisted SQL before real migration subset replay
        run: node security/build2/safe-column-migration-guard.mjs supabase/migrations
      - name: Replay six actual safe-column migrations twice with disposable rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-safe-column-migrations.integration.sql
      - name: Verify original settings index migration is strictly allowlisted
        run: node security/build2/unique-settings-index-guard.mjs supabase/migrations
      - name: Rehearse original unique settings index twice with rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-unique-settings-index.integration.sql
      - name: Guard original interview scheduling SQL source
        run: node security/build2/interview-scheduling-source-guard.mjs supabase/migrations
      - name: Rehearse original scheduling migration and token uniqueness with rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-interview-scheduling.integration.sql
      - name: Guard original mapping-function migration source
        run: node security/build2/google-mapping-source-guard.mjs supabase/migrations
      - name: Rehearse original mapping function and synthetic trigger behavior
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-google-mapping-function.integration.sql
      - name: Verify baseline auth and billing dependency release hold
        run: node --test security/build2/baseline-schema-dependency.test.mjs
      - name: Reject unsafe relationship backfill promotion
        run: node --test security/build2/relationship-backfill-risk.test.mjs
      - name: Guard original integration owner backfill exact source
        run: node security/build2/integration-owner-original-source-guard.mjs supabase/migrations
      - name: Validate synthetic relationship uniqueness foreign keys and delete semantics
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/relationship-link-integrity.integration.sql
      - name: Validate synthetic submission, offer, and billing ambiguity with corrected SQL delimiters
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/relationship-backfill-ambiguity.integration.sql
      - name: Rehearse original integration owner backfill twice with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-integration-owner.integration.sql
      - name: Guard original integration mapping backfill exact source
        run: node security/build2/integration-mapping-original-source-guard.mjs supabase/migrations
      - name: Rehearse original integration mapping twice with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-integration-mapping.integration.sql
      - name: Guard original trigger privilege migration exact source
        run: node security/build2/trigger-privilege-original-source-guard.mjs supabase/migrations
      - name: Rehearse original trigger privilege migration twice with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-trigger-privilege.integration.sql
      - name: Guard original candidate sync migration exact source
        run: node security/build2/candidate-sync-original-source-guard.mjs supabase/migrations
      - name: Rehearse original candidate sync migration twice with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-candidate-sync.integration.sql
      - name: Guard original branding migration exact source
        run: node security/build2/branding-original-source-guard.mjs supabase/migrations
      - name: Rehearse original branding migration with synthetic storage rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-branding.integration.sql
      - name: Guard original integration schema pair exact source
        run: node security/build2/integration-schema-original-source-guard.mjs supabase/migrations
      - name: Rehearse original integration schema pair with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-integration-schema-pair.integration.sql
      - name: Guard original email log migration exact source
        run: node security/build2/email-log-original-source-guard.mjs supabase/migrations
      - name: Rehearse original email log migration with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-email-log.integration.sql
      - name: Guard both original RLS policy migrations
        run: node security/build2/rls-policy-original-source-guard.mjs supabase/migrations
      - name: Rehearse two original RLS policy migrations with synthetic rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-rls-policy-pair.integration.sql
      - name: Guard original candidate defaults trigger SQL before replay
        run: node security/build2/candidate-defaults-trigger-source-guard.mjs supabase/migrations
      - name: Rehearse original candidate defaults trigger twice with rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-candidate-defaults-trigger.integration.sql
      - name: Verify disposable synthetic auth dependency fixture and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-auth-dependency.integration.sql
      - name: Verify synthetic security-invoker view obeys recruiter RLS
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-view-rls.integration.sql
      - name: Verify synthetic RPC PUBLIC privilege revocation
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-rpc-grants.integration.sql
      - name: Verify recruiter aggregate isolation and finance view denial
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-aggregate-view.integration.sql
      - name: Verify live-column-shaped candidate RLS and inactive-account denial
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/live-column-shaped-rls.integration.sql
      - name: Verify approval helpers and self-scoped RPC privilege boundary
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-authorization-helpers.integration.sql
      - name: Compile and test actual review-only RLS draft in disposable PostgreSQL
        run: |
          node security/build2/generate-policy-proposal-disposable.mjs
          psql -X -v ON_ERROR_STOP=1 -f /tmp/build2-policy-proposal-disposable.sql
      - name: Batch-check 19 table grants, 13 view hardening settings and three additional policies
        run: |
          node security/build2/generate-extra-proposals-disposable.mjs
          psql -X -v ON_ERROR_STOP=1 -f /tmp/build2-extra-proposals-disposable.sql
      - name: Verify three production-definition-shaped invoker views
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-view-definitions-shaped.integration.sql
      - name: Verify recruiter aggregate isolation across active and inactive identities
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/recruiter-aggregate-shaped.integration.sql
      - name: Verify actual privileged RPC grant draft and internal scheduler principal
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-actual-rpc-proposal.integration.sql
      - name: Rehearse transactional security rollback on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-rollback-rehearsal.integration.sql
      - name: Reject privileged workflow updates to sensitive fields
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-workflow-field-allowlist.integration.sql
      - name: Test candidate stage-history row isolation and direct write denial
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-stage-history-isolation.integration.sql
      - name: Verify privileged history trigger remains compatible with direct-write denial
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-stage-history-trigger.integration.sql
      - name: Exercise candidate stage transition chain and unauthorized side-effect denial
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-stage-transition-chain.integration.sql
      - name: Contrast swallowed stage automation failures with fail-closed rollback
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-stage-automation-failure.integration.sql
      - name: Rehearse duplicate candidate defaults triggers and safe single-trigger behavior
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-duplicate-defaults-trigger.integration.sql
      - name: Verify SECURITY DEFINER search-path hardening boundary
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-definer-search-path.integration.sql
      - name: Exercise privileged workflow trigger with in-function field allowlist
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-workflow-trigger-guard.integration.sql

      - name: Pin exact original activity and configurable-workflow migration sources
        run: node security/build2/activity-workflow-original-source-guard.mjs
      - name: Rehearse TWO original activity and configurable workflow migrations with synthetic rollback
        shell: bash
        run: |
          set -euo pipefail
          createdb build2_activity_workflow_synthetic
          trap 'dropdb --if-exists build2_activity_workflow_synthetic' EXIT
          PGDATABASE=build2_activity_workflow_synthetic psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-activity-workflow-pair.integration.sql
      - name: Pin exact original hourly reminder migration source
        run: node security/build2/reminder-original-source-guard.mjs
      - name: Rehearse original reminder SQL with four synthetic types and inert cron recording
        shell: bash
        run: |
          set -euo pipefail
          createdb build2_reminder_synthetic
          trap 'dropdb --if-exists build2_reminder_synthetic' EXIT
          PGDATABASE=build2_reminder_synthetic psql -X -v ON_ERROR_STOP=1 -f security/build2/actual-reminders-original.integration.sql
      - name: Verify synthetic recruiter ownership and silent RLS zero-row updates
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-recruiter-ownership-rls.integration.sql
      - name: Verify recruiter column UPDATE grants prevent ownership reassignment
        run: psql -X -v ON_ERROR_STOP=1 -f security/build2/synthetic-column-grant-ownership.integration.sql
      - name: Export and compare real disposable PostgreSQL catalog snapshots
        shell: bash
        run: |
          set -euo pipefail
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-catalog-before.json
          cp /tmp/build2-catalog-before.json /tmp/build2-catalog-equal.json
          node security/build2/schema-parity.mjs /tmp/build2-catalog-before.json /tmp/build2-catalog-equal.json
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE public.build2_parity_negative_fixture (id integer PRIMARY KEY);"
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-catalog-changed.json
          if node security/build2/schema-parity.mjs /tmp/build2-catalog-before.json /tmp/build2-catalog-changed.json; then
            echo "FAIL: schema drift was not detected"
            exit 1
          fi
          # Real PostgreSQL privilege drift, using disposable synthetic roles/objects only.
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; END \$\$;"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE public.build2_privilege_fixture (id integer, confidential_text text);"
          psql -X -v ON_ERROR_STOP=1 -c "REVOKE ALL ON public.build2_privilege_fixture FROM PUBLIC, anon;"
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-grants-before.json
          psql -X -v ON_ERROR_STOP=1 -c "GRANT SELECT (confidential_text) ON public.build2_privilege_fixture TO anon;"
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-grants-after.json
          if node security/build2/schema-parity.mjs /tmp/build2-grants-before.json /tmp/build2-grants-after.json > /tmp/build2-grants-diff.json; then
            echo "FAIL: column privilege escalation was not detected"
            exit 1
          fi
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('/tmp/build2-grants-diff.json','utf8')); if(!r.findings.some(x=>x.section==='grants'&&x.type==='changed_definition'))process.exit(1);"
          psql -X -v ON_ERROR_STOP=1 -c "REVOKE SELECT (confidential_text) ON public.build2_privilege_fixture FROM anon; DROP TABLE public.build2_privilege_fixture;"
          rm -f /tmp/build2-grants-before.json /tmp/build2-grants-after.json /tmp/build2-grants-diff.json
          echo "PASS: real disposable column-level privilege drift detected."

          # A synthetic RPC must not silently gain anon EXECUTE permission.
          psql -X -v ON_ERROR_STOP=1 -c "CREATE FUNCTION public.build2_privilege_rpc() RETURNS integer LANGUAGE sql AS 'SELECT 1';"
          psql -X -v ON_ERROR_STOP=1 -c "REVOKE ALL ON FUNCTION public.build2_privilege_rpc() FROM PUBLIC, anon;"
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-rpc-before.json
          psql -X -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON FUNCTION public.build2_privilege_rpc() TO anon;"
          psql -X -At -v ON_ERROR_STOP=1 -f security/build2/schema-parity-export-readonly.sql > /tmp/build2-rpc-after.json
          if node security/build2/schema-parity.mjs /tmp/build2-rpc-before.json /tmp/build2-rpc-after.json > /tmp/build2-rpc-diff.json; then
            echo "FAIL: RPC EXECUTE privilege escalation was not detected"
            exit 1
          fi
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('/tmp/build2-rpc-diff.json','utf8')); if(!r.findings.some(x=>x.section==='grants'&&x.type==='changed_definition'&&x.key.includes('function:build2_privilege_rpc')))process.exit(1);"
          psql -X -v ON_ERROR_STOP=1 -c "REVOKE EXECUTE ON FUNCTION public.build2_privilege_rpc() FROM anon; DROP FUNCTION public.build2_privilege_rpc();"
          rm -f /tmp/build2-rpc-before.json /tmp/build2-rpc-after.json /tmp/build2-rpc-diff.json
          echo "PASS: real disposable RPC EXECUTE privilege drift detected."

          psql -X -v ON_ERROR_STOP=1 -c "DROP TABLE public.build2_parity_negative_fixture;"
          rm -f /tmp/build2-catalog-before.json /tmp/build2-catalog-equal.json /tmp/build2-catalog-changed.json
          echo "PASS: live disposable catalog export and negative schema-drift detection."

      - name: Rehearse disposable synthetic database backup and restore
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic fixture only: proves that the restore preserves actual row values.
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE TABLE public.build2_restore_sentinel (id integer PRIMARY KEY, marker text NOT NULL); INSERT INTO public.build2_restore_sentinel VALUES (1, 'synthetic-restore-check'), (2, 'synthetic-row-integrity');"
          pg_dump -Fc --no-owner --no-acl -f /tmp/build2-synthetic-backup.dump "$PGDATABASE"
          createdb build2_synthetic_restored
          pg_restore --exit-on-error --no-owner --no-acl -d build2_synthetic_restored /tmp/build2-synthetic-backup.dump
          query="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v');"
          before=$(psql -X -At -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "$query")
          after=$(psql -X -At -v ON_ERROR_STOP=1 -d build2_synthetic_restored -c "$query")
          test "$before" -gt 0
          test "$before" -eq "$after"
          data_query="SELECT md5(string_agg(id::text || ':' || marker, ',' ORDER BY id)) FROM public.build2_restore_sentinel;"
          original_data=$(psql -X -At -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "$data_query")
          restored_data=$(psql -X -At -v ON_ERROR_STOP=1 -d build2_synthetic_restored -c "$data_query")
          test -n "$original_data"
          test "$original_data" = "$restored_data"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -d build2_synthetic_restored -c 'SELECT count(*) FROM public.build2_restore_sentinel;')" -eq 2
          for catalog_query in \
            "SELECT count(*) FROM pg_policies WHERE schemaname='public';" \
            "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public';" \
            "SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal;"; do
            original=$(psql -X -At -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "$catalog_query")
            restored=$(psql -X -At -v ON_ERROR_STOP=1 -d build2_synthetic_restored -c "$catalog_query")
            test "$original" -eq "$restored"
          done
          # A raw pg_dump schema hash is not stable across restored databases:
          # dump headers and database-local metadata can differ without schema drift.
          # Compare deterministic catalog definitions instead.
          fingerprint_query="SELECT md5(string_agg(kind || ':' || name || ':' || definition, E'\n' ORDER BY kind,name,definition)) FROM (
            SELECT 'view' kind, c.relname name, pg_get_viewdef(c.oid,true) definition
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='v'
            UNION ALL
            SELECT 'function', p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')', pg_get_functiondef(p.oid)
            FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'
            UNION ALL
            SELECT 'policy', tablename || '.' || policyname, cmd || ':' || roles::text || ':' || coalesce(qual,'') || ':' || coalesce(with_check,'')
            FROM pg_policies WHERE schemaname='public'
            UNION ALL
            SELECT 'trigger', c.relname || '.' || t.tgname, pg_get_triggerdef(t.oid)
            FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND NOT t.tgisinternal
          ) definitions;"
          original_schema=$(psql -X -At -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "$fingerprint_query")
          restored_schema=$(psql -X -At -v ON_ERROR_STOP=1 -d build2_synthetic_restored -c "$fingerprint_query")
          test -n "$original_schema"
          test "$original_schema" = "$restored_schema"
          echo "PASS: disposable synthetic restore preserves relation counts and deterministic view, function, policy and trigger definitions."
          rm -f /tmp/build2-synthetic-backup.dump

  consolidated-batch-report:
    name: Consolidated disposable migration report (HOLD)
    if: ${{ always() && github.ref == 'refs/heads/security/build2-step35e-main-delta-draft-20261110' }}
    needs: [application-typescript-check, offline-security-tests, isolated-postgres-view-rls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate consolidated 26-file report and fail closed on any failed prerequisite
        env:
          BUILD2_APP_RESULT: ${{ needs.application-typescript-check.result }}
          BUILD2_OFFLINE_RESULT: ${{ needs.offline-security-tests.result }}
          BUILD2_PG_RESULT: ${{ needs.isolated-postgres-view-rls.result }}
        run: |
          node security/build2/batch-ci-report.mjs supabase/migrations security/build2/release-evidence.json build2-batch-report.json
      - name: Publish consolidated HOLD summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f build2-batch-report.json ]; then
            node --input-type=module -e "import {readFileSync,appendFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('build2-batch-report.json','utf8')); const lines=['## AMF Build 2 — '+r.status,'','- Verification: '+r.verification,'- Original migrations verified in this run: '+r.ci_verified_replays+'/26','- Remaining dependency review: '+r.remaining_manual_dependency_review+'/26','- Authorization scenarios executed: 0/140','- Release gates passed: 0/9','- No production equivalence or release approval'];appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');"
          else
            echo '## AMF Build 2 — report missing; HOLD and NOT VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report even when prerequisite tests fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build2-disposable-batch-report
          path: build2-batch-report.json
          if-no-files-found: error
          retention-days: 30
