name: Security release gates
on:
  push:
    branches: [security-isolation-test]
  pull_request:
    branches: [main]
jobs:
  release-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed security gates
        run: node --test tests/security-release-gates.test.mjs
