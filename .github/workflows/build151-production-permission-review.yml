# Build151: source provenance and static review only. No Supabase/Postgres credentials.
name: Build151–191 Production Permission Review — Disposable PG17 Only
on:
  pull_request:
    paths:
      - 'security/build151-production-permissions-review/**'
      - '.github/workflows/build151-production-permission-review.yml'
permissions:
  contents: read
jobs:
  reviewed_source_contract:
    name: Source-pinned 48-object production permission review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test security/build151-production-permissions-review/review-contract.test.mjs
  proposed-postflight-pg17:
    name: Proposed 48-object postflight + 25 PG17 rollback-scoped unsafe mutations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Execute source-pinned read-only postflight against fictional catalog only
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: synthetic-disposable-only
        run: |
          set -euo pipefail
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          python3 - <<'PY'
          from pathlib import Path
          source = Path('security/build151-production-permissions-review/build191-postflight.readonly.sql').read_text().rstrip()
          assert source.endswith('FROM aggregate;'), 'Source is not the expected single-statement query'
          Path('/tmp/build191-postflight.gset.sql').write_text(source[:-1] + r' \gset' + '\n')
          PY
          psql -X -v ON_ERROR_STOP=1 -f security/build151-production-permissions-review/build191-postflight-disposable.pg17.sql
          echo 'BUILD191_ONLY_DISPOSABLE_PG17_NO_HOSTED_WRITES'
