name: CRM Phase 0 verification

on:
  push:
    branches:
      - main
      - 'chore/phase0-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bd-tests:
    name: Business Development model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:bd

  code-quality:
    name: Lint and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit

  production-equivalent-build:
    name: Build verification (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vite build without production credentials
        run: npm run build
        env:
          VITE_ENABLE_BD_DEMO: 'false'
