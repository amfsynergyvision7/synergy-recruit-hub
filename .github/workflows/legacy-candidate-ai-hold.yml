name: Legacy candidate privacy/Drive holds (review only)
on:
  pull_request:
    paths:
      - 'src/lib/ai.functions.ts'
      - 'src/lib/ai.server.ts'
      - 'src/lib/drive-import.server.ts'
      - 'src/lib/legacy-ai-drive-release-hold.server.ts'
      - 'tests/legacy-ai-drive-hold.test.mjs'
      - '.github/workflows/legacy-candidate-ai-hold.yml'
  push:
    branches:
      - 'security/legacy-candidate-ai-drive-hold-20261117'
permissions:
  contents: read
jobs:
  privacy-hold-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/legacy-ai-drive-hold.test.mjs
  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
