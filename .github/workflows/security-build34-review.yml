      - 'security/build37/**'
      - 'security/build38/**'
      - 'security/build40/**'
      - 'security/build41/**'
      - 'security/build42/**'
      - 'security/build43/**'
      - 'security/build44/**'
      - 'security/build45/**'
      - 'security/build46/**'
      - 'security/build47/**'
      - 'security/build48/**'
      - 'security/build49/**'
      - 'security/build50/**'
      - 'security/build51/**'
      - 'security/build52/**'
      - 'security/build53/**'
      - 'src/lib/candidate-batch-import.ts'
      - 'src/lib/duplicate-review-export.ts'
      - 'src/routes/_app.duplicates.tsx'
      - 'src/lib/candidate-write.ts'
      - 'src/lib/candidate-stage.ts'
      - 'src/lib/release-safety.ts'
      - 'src/components/CrudModule.tsx'
      - 'src/components/CandidateBoard.tsx'
      - 'src/routes/_app.import.tsx'
      - 'src/routes/_app.duplicates.tsx'
      - 'src/lib/user-administration.ts'
      - 'src/lib/profile-settings.ts'
      - 'src/routes/_app.users.tsx'
      - 'src/routes/_app.settings.tsx'
      - 'src/lib/integrations.functions.ts'
      - 'src/lib/drive-import.server.ts'
      - 'src/components/DriveImportButton.tsx'
      - 'src/lib/sync-lease.server.ts'
      - '.github/workflows/security-build34-review.yml'
permissions:
  contents: read
jobs:
  offline-authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed webhook and account authorization without credentials
        run: node --experimental-strip-types --test security/build34/*.test.mjs security/build36/*.test.mjs security/build37/*.test.mjs
  application-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit

  synthetic-lease-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse synthetic lease transitions in disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build36/synthetic-sync-lease.sql
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build37/sync-lease.integration.sql
      - name: Verify two PostgreSQL sessions cannot acquire the same owner lease
        env:
          PGPASSWORD: postgres
        run: bash security/build37/two-session-lease.test.sh
  source-shaped-rls-and-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
