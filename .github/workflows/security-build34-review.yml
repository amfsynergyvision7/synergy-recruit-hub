permissions:
  contents: read
# Supersede stale review-branch workflows when many approved edits land in bulk.
# This never disables the latest production-release hold.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline-authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed webhook and account authorization without credentials
        run: node --experimental-strip-types --test security/build34/*.test.mjs security/build36/*.test.mjs security/build37/*.test.mjs
  application-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit

  synthetic-lease-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse synthetic lease transitions in disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build36/synthetic-sync-lease.sql
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build37/sync-lease.integration.sql
      - name: Verify two PostgreSQL sessions cannot acquire the same owner lease
        env:
          PGPASSWORD: postgres
        run: bash security/build37/two-session-lease.test.sh
  source-shaped-rls-and-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production-shaped 140-case RLS and 16-table grant SQL suites in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: bash security/build38/run_database_contracts.sh
  expanded-public-security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 19 tables, 13 views and 16 privileged functions in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: bash security/build40/run_full_scope.sh
      - name: Audit actual CRM callsites affected by proposed grants
        run: node security/build40/repository-compatibility-audit.mjs
      - name: Reproduce five exact live recruiter views and review-only role correction in disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build70_recruiter_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build70_recruiter_lab -f security/build70/five-recruiter-view-semantics.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build70_recruiter_lab -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='v'")" = "0"
          dropdb -h localhost -U postgres amf_build70_recruiter_lab
      - name: Demonstrate thirteen actual default-definer view anonymous leaks and invoker/RLS/grant fixes in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build71_view_leak_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build71_view_leak_lab -f security/build71/all-13-view-anonymous-exposure.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build71_view_leak_lab -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='v'")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build71_view_leak_lab -c "SELECT count(*) FROM pg_roles WHERE rolname='b71_anon'")" = "0"
          dropdb -h localhost -U postgres amf_build71_view_leak_lab
      - name: Demonstrate 19 RLS tables vulnerable to anonymous TRUNCATE, then prove revocation in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build72_truncate_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_truncate_lab -f security/build72/all-19-anon-truncate-rls-bypass.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_truncate_lab -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_truncate_lab -c "SELECT count(*) FROM pg_roles WHERE rolname='b72_anon'")" = "0"
          dropdb -h localhost -U postgres amf_build72_truncate_lab
      - name: Demonstrate nine inherited PUBLIC function grants after anon-only revoke and proper two-layer privileges cleanup
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build72_func_acl_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_func_acl_lab -f security/build72/all-16-function-public-fallback.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_func_acl_lab -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prosecdef")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build72_func_acl_lab -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('b72_fn_anon','b72_fn_authenticated')")" = "0"
          dropdb -h localhost -U postgres amf_build72_func_acl_lab
      - name: Prove full 48-object schema permission gate HOLD then conditional pass in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build73_permissions_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build73_permissions_lab -f security/build73/48-object-permission-before-after.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build73_permissions_lab -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v')")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build73_permissions_lab -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prosecdef")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build73_permissions_lab -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('b73_anon','b73_authenticated')")" = "0"
          dropdb -h localhost -U postgres amf_build73_permissions_lab
      - name: Prove live-structure auth auto-profile hazard and 9-user fixture positive/negative integrity with rollback
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amf_build75_auth_lab
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build75_auth_lab -f security/build75/auth-autoprofile-and-nine-slot.rollback.sql
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build75_auth_lab -f security/build75/auth-bootstrap-no-email-admin.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build75_auth_lab -c "SELECT count(*) FROM pg_catalog.pg_namespace WHERE nspname='auth'")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build75_auth_lab -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v')")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d amf_build75_auth_lab -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='synthetic_auth_autoprofile'")" = "0"
          dropdb -h localhost -U postgres amf_build75_auth_lab

