name: Build 34 guarded sync and role-gate review
on:
  push:
    branches:
      - security/build34-guarded-sync-review-20261111
  pull_request:
    paths:
      - 'src/lib/cron-auth.server.ts'
      - 'src/lib/access-gates.server.ts'
      - 'src/lib/approved-role-policy.ts'
      - 'src/lib/ai.functions.ts'
      - 'src/lib/sheets-sync.server.ts'
      - 'src/routes/api/public/hooks/sheets-sync.ts'
      - 'security/build34/**'
      - 'security/build36/**'
      - 'security/build37/**'
      - 'security/build38/**'
      - 'security/build40/**'
      - 'src/lib/sync-lease.server.ts'
      - '.github/workflows/security-build34-review.yml'
permissions:
  contents: read
jobs:
  offline-authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed webhook and account authorization without credentials
        run: node --experimental-strip-types --test security/build34/*.test.mjs security/build36/*.test.mjs security/build37/*.test.mjs
  application-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit

  synthetic-lease-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse synthetic lease transitions in disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build36/synthetic-sync-lease.sql
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build37/sync-lease.integration.sql
      - name: Verify two PostgreSQL sessions cannot acquire the same owner lease
        env:
          PGPASSWORD: postgres
        run: bash security/build37/two-session-lease.test.sh
  source-shaped-rls-and-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production-shaped 140-case RLS and 16-table grant SQL suites in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: bash security/build38/run_database_contracts.sh
  expanded-public-security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 19 tables, 13 views and 16 privileged functions in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: bash security/build40/run_full_scope.sh
      - name: Audit actual CRM callsites affected by proposed grants
        run: node security/build40/repository-compatibility-audit.mjs
  admin-settings-rpc-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify CRM Settings uses protected admin RPC calls
        run: node --test security/build40/admin-settings-source.test.mjs
      - name: Test anonymous, recruiter, pending, inactive and admin SQL access
        env:
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f security/build40/admin-settings-rpc.integration.sql
  production-release-hold:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'PRODUCTION RELEASE BLOCKED: nine formal release gates and independent authorization remain incomplete.'
          exit 1
