  build54-guarded-candidate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic non-executable review bundle and isolated rollback-only migration
        run: node security/build54/assemble-release-review.mjs
      - name: Verify release hold, exact source SHA256, and hosted Auth mock preflight
        run: node --test security/build54/source-contract.test.mjs security/build54/hosted-auth-preflight.test.mjs security/build54/pr-reconciliation-contract.test.mjs security/build63/readback-contract.test.mjs
      - name: Simulate a SQL client that continues on error; release refusal must have no executable DDL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=0 -h localhost -U postgres -d postgres -f /tmp/build54-release-review/release-review-hold.sql > /tmp/build54-refusal.log 2>&1 || true
          grep -Fq 'Build54 release BLOCKED' /tmp/build54-refusal.log
          ! grep -Eq '^((CREATE|ALTER|DROP|INSERT|UPDATE|DELETE|TRUNCATE|COMMIT|BEGIN|ROLLBACK)[[:space:];])' /tmp/build54-release-review/release-review-hold.sql
          test "$(psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename='candidates'")" = "0"
      - name: Execute exact source-composed policy, account and candidate migration inside disposable rollback
        env:
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f /tmp/build54-release-review/full-release-rollback.integration.sql
      - name: Reconcile true combined release candidate with 22 privileged functions and 35 policies in separate rolled-back PostgreSQL rehearsal
        env:
          PGPASSWORD: postgres
        run: |
          node security/build74/compose-postrelease-permission-check.mjs
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f /tmp/build54-release-review/build74-22-function-rollback.integration.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prosecdef")" = "0"
      - name: Prove exact combined release rejects reintroduced anon candidate-import RPC and destructive TRUNCATE grants
        env:
          PGPASSWORD: postgres
        run: |
          node security/build74/compose-negative-release-replays.mjs
          for case in anonymous_candidate_rpc anonymous_table_truncate; do
            if psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "/tmp/build54-release-review/build74-negative-${case}.integration.sql" > "/tmp/build74-negative-${case}.log" 2>&1; then
              echo "FAIL: expected Build74 postflight to reject unsafe grant in ${case}"
              exit 1
            fi
            grep -Fq "Build74 22-function permission postflight failed" "/tmp/build74-negative-${case}.log"
          done
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v')")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prosecdef")" = "0"


      - name: Confirm no schema changes persisted from rollback-only rehearsal
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('candidates','profiles','billing');" | grep -x 0

