name: Build165 Category C Lead Discovery — synthetic only
on:
  pull_request:
    paths:
      - 'security/lead-discovery/**'
      - 'security/build165-lead-category/**'
      - 'security/build166-lead-category/**'
      - 'security/build167-lead-category/**'
      - 'security/build168-lead-category/**'
      - 'security/build170-lead-category/**'
      - 'security/build171-lead-category/**'
      - 'security/build121/**'
      - 'security/build122/**'
      - '.github/workflows/build165-category-c.yml'
permissions:
  contents: read
jobs:
  category-c-offline:
    name: Lead research evidence + KPI no-send contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test security/build121/lead-discovery.test.mjs security/build122/lead-review-and-handoff.test.mjs security/build165-lead-category/contract.test.mjs security/build166-lead-category/contract.test.mjs security/build167-lead-category/contract.test.mjs security/build168-lead-category/contract.test.mjs security/build170-lead-category/main-isolation.test.mjs security/build171-lead-category/frozen-scorecard.test.mjs
      - run: node security/lead-discovery/approval-preflight.mjs
      - run: node security/lead-discovery/acceptance-handoff.mjs
      - run: node security/lead-discovery/reconcile.mjs security/lead-discovery/manifest.synthetic.json security/lead-discovery/review-decisions.synthetic.json
      - run: node security/lead-discovery/category-status.mjs --check
      - run: node security/lead-discovery/metrics.mjs security/lead-discovery/manifest.synthetic.json security/lead-discovery/review-decisions.synthetic.json 2026-11-15

  # This main-target PR is not a production release. Main is unprotected as of
  # 2026-11-15; hold remains an intentionally failing job. The draft PR is
  # also intentionally NOT READY to merge.
  main-release-hold:
    if: github.base_ref == 'main'
    name: Main merge and production release — HOLD (intentionally fails)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'MAIN RELEASE HOLD: protected main, independent approvals, hosted UAT and audit permissions not accepted.'
          echo 'Category C LD02 and LD05 have no independently signed operating acceptance.'
          exit 1
